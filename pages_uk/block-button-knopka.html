<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button (Кнопка)</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #222; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { color: #2c3e50; }
        p { margin: 10px 0; }
        .note { background: #f0f7ff; border-left: 4px solid #3498db; padding: 10px; margin: 15px 0; }
    </style>
</head>
<body>
    <h1>Button (Кнопка)</h1>
    <p>Кнопка для натискання. Використовуйте подію onClick для обробки натискань. Можна змінювати текст через блок setText.</p>
    <div class="note">
        <strong>Примітка:</strong> Це базова довідка. Детальний опис і приклади використання будуть додані пізніше.
    </div>
</body>
</html>
